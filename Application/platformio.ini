; Joule Observer WiFi dashboard for the ESP32-DevKitC-32E (classic ESP32).
; The ATmega328P sends readings to UART2 (GPIO16 RX, GPIO17 TX). Formats: docs/spec.md
;
;   pio run -e mock -t upload       simulated readings, no ATmega needed
;   pio run -e esp32dev -t upload   real readings from the ATmega
;   pio device monitor              USB log: every line received from the ATmega

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; No lib_deps: WiFi, WebServer and DNSServer come with the ESP32 Arduino core.
; Builds web/index.html into the firmware, so one upload carries the page too
; (no LittleFS). embed_files, not embed_txtfiles: the txt variant rewrites the
; HTML file in place during every build.
board_build.embed_files = web/index.html

[env:esp32dev]

[env:mock]
build_flags = -D MOCK_ATMEGA
