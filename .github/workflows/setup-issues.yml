name: Project board issues

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: dry-run
        options:
          - dry-run
          - create
          - sync
          - list-mine
          - close-all
          - delete-all
          - wipe-labels

permissions:
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ${{ inputs.mode }}
        env:
          # delete-all needs repo admin, which GITHUB_TOKEN does not have.
          # Add a PAT with repo scope as a secret named ADMIN_TOKEN to use it.
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          FORCE: 1
        run: |
          case "${{ inputs.mode }}" in
            dry-run)     bash setup-issues.sh --dry-run ;;
            create)      bash setup-issues.sh ;;
            sync)        bash setup-issues.sh --sync ;;
            list-mine)   bash setup-issues.sh --list-mine ;;
            close-all)   bash setup-issues.sh --close-all ;;
            delete-all)  bash setup-issues.sh --delete-all ;;
            wipe-labels) bash setup-issues.sh --wipe-labels ;;
          esac
